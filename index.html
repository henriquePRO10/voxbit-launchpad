<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxBit Soluções | Sites, Sistemas Web e SEO</title>
    <meta name="description" content="VoxBit Soluções - Criação de sites, landing pages, sistemas web completos e SEO. Tecnologia sob medida para o seu negócio crescer." />
    <meta name="author" content="VoxBit Soluções" />

    <meta property="og:title" content="VoxBit Soluções | Tecnologia sob medida" />
    <meta property="og:description" content="Sites, sistemas web, SEO e presença digital. Soluções completas com segurança e performance." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="image" href="/logo-hero.webp" fetchpriority="high" />
    <!-- Crisp script removed; using toggle + iframe embed instead -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Crisp chat: toggle button + iframe (responsive, accessible) -->
    <style>
      #crisp-container { position: fixed; right: 20px; bottom: 20px; z-index: 2147483647; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
      #crisp-iframe { width: 360px; height: 640px; border: 0; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); display: none; }
      #crisp-toggle { width:56px; height:56px; border-radius:50%; background:#0b76ff; color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,0.2); border:0; }
      @media (max-width:420px){
        #crisp-iframe { width: calc(100vw - 32px); height: 70vh; right: 16px; left: 16px; border-radius:10px; }
        #crisp-container { right: 8px; bottom: 12px; left: 8px; align-items:center; }
      }
    </style>

    <div id="crisp-container" aria-live="polite">
      <button id="crisp-toggle" aria-expanded="false" aria-controls="crisp-iframe" aria-label="Abrir chat">💬</button>
      <iframe id="crisp-iframe" title="Chat Crisp" src="https://go.crisp.chat/chat/embed/?website_id=588f1932-1e8f-4870-9811-d9e8caf983e8" aria-hidden="true"></iframe>
    </div>

    <script>
      const toggle = document.getElementById('crisp-toggle');
      const iframe = document.getElementById('crisp-iframe');
      toggle.addEventListener('click', () => {
        const isOpen = iframe.style.display === 'block';
        iframe.style.display = isOpen ? 'none' : 'block';
        iframe.setAttribute('aria-hidden', isOpen ? 'true' : 'false');
        toggle.setAttribute('aria-expanded', String(!isOpen));
        if (!isOpen) iframe.focus();
      });
    </script>
  </body>
</html>
